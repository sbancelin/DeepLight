    <!-- Diagonales légèrement plus courtes -->
    <line x1="30" y1="30" x2="46" y2="46"/>
    <line x1="82" y1="82" x2="98" y2="98"/>
    <line x1="30" y1="98" x2="46" y2="82"/>
    <line x1="82" y1="46" x2="98" y2="30"/>

  </g>

  <!-- Centre blanc -->
